# fly.toml app configuration file generated for gisele-2025 on 2025-12-05T14:24:00-05:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'gisele-2025'
primary_region = 'iad'

[env]
  HOST = '0.0.0.0'
  PORT = '3000'

[build]

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
